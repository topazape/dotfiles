gui:
  switchTabsWithPanelJumpKeys: true
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  nerdFontsVersion: "3"

git:
  autoFetch: true
  autoRefresh: true
  mainBranches:
    - main
    - master
  diffRenderers:
    - command: delta --paging=never

customCommands:
  - key: "C"
    context: "files"
    description: "commit with AI-generated message"

    prompts:
      - type: "menu"
        title: "Commit type"
        key: "Type"
        options:
          - name: "feat"
            description: "新機能の追加"
            value: "feat"

          - name: "fix"
            description: "バグや不具合の修正"
            value: "fix"

          - name: "refactor"
            description: "機能変更を伴わないコード改善"
            value: "refactor"

          - name: "docs"
            description: "ドキュメントのみの変更"
            value: "docs"

          - name: "chore"
            description: "ビルド、依存関係、設定などの雑務"
            value: "chore"

          - name: "test"
            description: "テストの追加・修正"
            value: "test"

          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"

      - type: "input"
        title: "(Optional) scope"
        key: "Scope"

    output: log
