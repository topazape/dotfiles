os:
  shell: bash
  shellArg: -c

gui:
  switchTabsWithPanelJumpKeys: true
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  nerdFontsVersion: "3"

git:
  autoFetch: true
  autoRefresh: true
  mainBranches:
    - main
    - master
  pagers:
    - pager: delta --paging=never

customCommands:
  - key: "C"
    context: "files"
    description: "commit with AI-generated message"
    prompts:
      - type: "menu"
        title: "Commit type"
        key: "Type"
        options:
          - name: "feat"
            description: "新機能の追加"
            value: "feat"
          - name: "fix"
            description: "バグや不具合の修正"
            value: "fix"
          - name: "refactor"
            description: "機能変更を伴わないコード改善"
            value: "refactor"
          - name: "docs"
            description: "ドキュメントのみの変更"
            value: "docs"
          - name: "chore"
            description: "ビルド、依存関係、設定などの雑務"
            value: "chore"
          - name: "test"
            description: "テストの追加・修正"
            value: "test"
          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"
      - type: "input"
        title: "(Optional) scope"
        key: "Scope"
    command: >-
      model="${LLAMA_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/llama.cpp}/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf";
      msg=$(git diff --cached | head -c 12000 |
        llama-completion -m "$model" -no-cnv --no-display-prompt -n 64
        -p "以下は git diff --cached, type='{{.Form.Type}}' に合うコミット件名を日本語で1行だけ、接頭辞・説明・引用符なし、50字以内で出力せよ" 2>/dev/null
        | head -n1 | sed -E 's/^[-*[:digit:].)]+[[:space:]]*//');
      scope="{{.Form.Scope}}";
      git commit -e -m "{{.Form.Type}}${scope:+($scope)}: $msg"
    subprocess: true
    loadingText: "Generating commit message..."
