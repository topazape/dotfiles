gui:
  switchTabsWithPanelJumpKeys: true
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  nerdFontsVersion: "3"

git:
  autoFetch: true
  autoRefresh: true
  mainBranches:
    - main
    - master
  diffRenderers:
    - command: delta --paging=never

customCommands:
  - key: "C"
    context: "files"
    description: "commit with AI-generated message"
    prompts:
      - type: "menu"
        title: "Commit type"
        key: "Type"
        options:
          - name: "feat"
            description: "新機能の追加"
            value: "feat"
          - name: "fix"
            description: "バグや不具合の修正"
            value: "fix"
          - name: "refactor"
            description: "機能変更を伴わないコード改善"
            value: "refactor"
          - name: "docs"
            description: "ドキュメントのみの変更"
            value: "docs"
          - name: "chore"
            description: "ビルド、依存関係、設定などの雑務"
            value: "chore"
          - name: "test"
            description: "テストの追加・修正"
            value: "test"
          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"

      - type: "input"
        title: "(Optional) scope"
        key: "Scope"

    command: |
      bash -c '
        set -o pipefail

        type="$1"
        scope="$2"

        model="${LLAMA_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/llama.cpp}/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

        if ! command -v llama-completion >/dev/null 2>&1; then
          echo "error: llama-completion not found" >&2
          exit 1
        fi

        if [ ! -f "$model" ]; then
          echo "error: model not found: $model" >&2
          exit 1
        fi

        diff=$(git diff --cached | head -c 12000)

        if [ -z "$diff" ]; then
          echo "error: no staged changes" >&2
          exit 1
        fi

        prompt="以下は git diff --cached。
      type=${type} に合うコミット件名を日本語で1行だけ出力してください。
      接頭辞、説明、引用符は不要です。
      50字以内にしてください。

      ${diff}"

        msg=$(
          llama-completion \
            -m "$model" \
            --single-turn \
            --no-display-prompt \
            --log-disable \
            -n 64 \
            -p "$prompt" \
            2>/dev/null |
            grep -m1 . |
            sed -E "s/^[-*[:digit:].)]+[[:space:]]*//"
        )

        if [ -z "$msg" ]; then
          echo "error: failed to generate commit message" >&2
          exit 1
        fi

        git commit -e -m "${type}${scope:+($scope)}: $msg"
      ' -- {{.Form.Type | quote}} {{.Form.Scope | quote}}

    output: terminal
