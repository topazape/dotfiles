gui:
  switchTabsWithPanelJumpKeys: true
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  nerdFontsVersion: "3"

git:
  autoFetch: true
  autoRefresh: true
  mainBranches:
    - main
    - master
  diffRenderers:
    - command: delta --paging=never

customCommands:
  - key: "C"
    context: "files"
    description: "commit with AI-generated message"

    prompts:
      - type: "menu"
        title: "Commit type"
        key: "Type"
        options:
          - name: "feat"
            description: "新機能の追加"
            value: "feat"

          - name: "fix"
            description: "バグや不具合の修正"
            value: "fix"

          - name: "refactor"
            description: "機能変更を伴わないコード改善"
            value: "refactor"

          - name: "docs"
            description: "ドキュメントのみの変更"
            value: "docs"

          - name: "chore"
            description: "ビルド、依存関係、設定などの雑務"
            value: "chore"

          - name: "test"
            description: "テストの追加・修正"
            value: "test"

          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"

      - type: "input"
        title: "(Optional) scope"
        key: "Scope"

    command: |
      bash -c '
        type="$1"
        scope="$2"

        model="${LLAMA_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/llama.cpp}/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

        if ! command -v llama-completion >/dev/null 2>&1; then
          echo "error: llama-completion not found" >&2
          exit 1
        fi

        if [ ! -f "$model" ]; then
          echo "error: model not found: $model" >&2
          exit 1
        fi

        diff=$(git diff --cached)

        if [ -z "$diff" ]; then
          echo "error: no staged changes" >&2
          exit 1
        fi

        diff="${diff:0:12000}"

        system_prompt="日本語のGitコミット件名を1行だけ生成してください。
        50字以内で、必ず体言止めにしてください。
        文末は「追加」「変更」「修正」「削除」「対応」「改善」「更新」などの名詞にしてください。
        「した」「する」「します」「しました」などの動詞終止形は禁止です。
        説明、箇条書き、引用符は出力しないでください。"

        prompt="コミット種別: ${type}
        スコープ: ${scope}

        次のGit差分から、変更内容を具体的に表すコミット件名を生成してください。

        ${diff}"

        err=$(mktemp)

        raw=$(
          llama-completion \
            -m "$model" \
            --single-turn \
            --no-display-prompt \
            --temp 0 \
            -n 48 \
            -sys "$system_prompt" \
            -p "$prompt" \
            2>"$err"
        )
        status=$?

        if [ "$status" -ne 0 ]; then
          echo "error: llama-completion failed (exit $status)" >&2
          cat "$err" >&2
          rm -f "$err"
          exit "$status"
        fi

        rm -f "$err"

        msg=$(
          printf "%s\n" "$raw" |
            grep -m1 "[^[:space:]]" |
            sed -E "s/^[-*[:digit:].)]+[[:space:]]*//" |
            sed -E "s/[[:space:]]*\[end of text\][[:space:]]*$//" |
            sed -E "s/[[:space:]]+$//"
        )

        if [ -z "$msg" ]; then
          echo "error: failed to generate commit message" >&2
          exit 1
        fi

        git commit -m "${type}${scope:+($scope)}: $msg"
      '

    output: log
