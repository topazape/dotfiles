gui:
  switchTabsWithPanelJumpKeys: true
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  nerdFontsVersion: "3"

git:
  autoFetch: true
  autoRefresh: true
  mainBranches:
    - main
    - master
  diffRenderers:
    - command: delta --paging=never

customCommands:
  - key: "C"
    context: "files"
    description: "commit with AI-generated message"

    prompts:
      - type: "menu"
        title: "Commit type"
        key: "Type"
        options:
          - name: "feat"
            description: "新機能の追加"
            value: "feat"

          - name: "fix"
            description: "バグや不具合の修正"
            value: "fix"

          - name: "refactor"
            description: "機能変更を伴わないコード改善"
            value: "refactor"

          - name: "docs"
            description: "ドキュメントのみの変更"
            value: "docs"

          - name: "chore"
            description: "ビルド、依存関係、設定などの雑務"
            value: "chore"

          - name: "test"
            description: "テストの追加・修正"
            value: "test"

          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"

      - type: "input"
        title: "(Optional) scope"
        key: "Scope"

    command: |
      bash -c '
        type="$1"
        scope="$2"

        model="${LLAMA_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/llama.cpp}/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

        if ! command -v llama-completion >/dev/null 2>&1; then
          echo "error: llama-completion not found" >&2
          exit 1
        fi

        if [ ! -f "$model" ]; then
          echo "error: model not found: $model" >&2
          exit 1
        fi

        diff=$(git diff --cached)

        if [ -z "$diff" ]; then
          echo "error: no staged changes" >&2
          exit 1
        fi

        diff="${diff:0:12000}"

        prompt="以下は git diff --cached です。
      変更内容を要約し、type=${type} に合う Git のコミット件名を日本語で1行だけ生成してください。

      制約:
      - 件名のみ出力する
      - type や scope などの接頭辞は付けない
      - 引用符を付けない
      - 箇条書きにしない
      - 50字以内

      ${diff}"

        err=$(mktemp)

        raw=$(
          llama-completion \
            -m "$model" \
            --no-display-prompt \
            --temp 0 \
            -n 64 \
            -p "$prompt" \
            2>"$err"
        )
        status=$?

        if [ "$status" -ne 0 ]; then
          echo "error: llama-completion failed (exit $status)" >&2
          cat "$err" >&2
          rm -f "$err"
          exit "$status"
        fi

        rm -f "$err"

        msg=$(
          printf "%s\n" "$raw" |
            grep -m1 "[^[:space:]]" |
            sed -E "s/^[-*[:digit:].)]+[[:space:]]*//"
        )

        if [ -z "$msg" ]; then
          echo "error: failed to generate commit message" >&2
          exit 1
        fi

        git commit -e -m "${type}${scope:+($scope)}: $msg"
      ' -- {{.Form.Type | quote}} {{.Form.Scope | quote}}

    output: terminal
