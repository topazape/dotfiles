gui:
  switchTabsWithPanelJumpKeys: true
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  nerdFontsVersion: "3"

git:
  autoFetch: true
  autoRefresh: true
  mainBranches:
    - main
    - master
  pagers:
    - pager: delta --paging=never

customCommands:
  - key: "C"
    context: "files"
    description: "commit files with AI-generated message"
    prompts:
      - type: "menu"
        title: "What kind of commit type is it?"
        key: "Type"
        options:
          - name: "feat"
            description: "新機能の追加"
            value: "feat"
          - name: "fix"
            description: "バグや不具合の修正"
            value: "fix"
          - name: "refactor"
            description: "機能変更を伴わないコード改善"
            value: "refactor"
          - name: "docs"
            description: "ドキュメントのみの変更"
            value: "docs"
          - name: "chore"
            description: "ビルド、依存関係、設定などの雑務"
            value: "chore"
          - name: "test"
            description: "テストの追加・修正"
            value: "test"
          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"
      - type: "input"
        title: "(Optional) Enter the scope"
        key: "Scope"
        initialValue: ""

    command: >-
      bash -c '
        type="{{.Form.Type}}"
        scope="{{.Form.Scope}}"
        message=$(git diff --staged | claude --model claude-sonnet-5 --print --no-session-persistence "この git diff --staged の出力を読み、コミットメッセージ本文を日本語1行で出力してください。種別「$type」と scope は呼び出し側が「type(scope): 」として前置するので、本文に prefix・種別語・scope 名を含めないこと。全角50字以内、体言止め、末尾に句点なし。ファイル名の列挙ではなく何をどう変えたかを書き、複数の変更がある場合は主要なものを優先して最大2点まで。前置き・説明・引用符・バッククォート・改行・署名（Co-Authored-By 等）は一切含めず、本文のみを出力すること。")
        if [ -n "$scope" ]; then
          commit_message="$type($scope): $message"
        else
          commit_message="$type: $message"
        fi
        git commit -m "$commit_message"
      '
    loadingText: "Generating commit message..."
